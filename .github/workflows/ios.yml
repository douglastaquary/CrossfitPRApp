# Validação oficial em Xcode / iOS recentes (runners GitHub).
# Desenvolvimento local Xcode 14.2: ./scripts/configure-spm-xcode14.sh — ver docs/CI.md
name: iOS — Xcode moderno

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-modern-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modern-xcode-qa:
    name: Build & test (Xcode latest)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Selecionar Xcode mais recente estável
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Versões (log)
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available | head -20

      - name: Build & test (scripts/ci-modern.sh)
        env:
          CODE_SIGNING_ALLOWED: "NO"
          XCODEGEN_VERSION: "2.46.0"
          SIM_DEVICE: "iPhone 17 Pro"
          # UDID varia por runner; o script resolve pelo nome + runtime iOS mais novo.
          # Override pontual: SIM_UDID ou SIM_DEST (destino xcodebuild completo).
        run: bash scripts/ci-modern.sh
