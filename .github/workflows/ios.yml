name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and localization QA (iOS Simulator)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select simulator
        id: sim
        run: |
          device=$(xcrun simctl list devices available -j | ruby -e "
            require 'json'
            devs = JSON.parse(STDIN.read)['devices'].values.flatten
            pick = devs.find { |d| d['name'] =~ /iPhone 1[56]/ && d['isAvailable'] } ||
                   devs.find { |d| d['name'] =~ /iPhone/ && d['isAvailable'] }
            puts pick ? pick['name'] : 'iPhone 15'
          ")
          echo "name=$device" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $device"

      - name: Build
        run: |
          xcodebuild build \
            -scheme CrossfitPR \
            -project CrossfitPR.xcodeproj \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO

      - name: UI tests — AppLocalizationQATests
        run: |
          xcodebuild test \
            -scheme CrossfitPR \
            -project CrossfitPR.xcodeproj \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:CrossfitPRUITests/AppLocalizationQATests \
            -skip-testing:CrossfitPRUITests/ReadmeScreenshotsUITests

      - name: Unit tests — Localization (Swift Testing)
        run: |
          cd Packages/Localization
          swift test
